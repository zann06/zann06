<svg width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <style>
    .title { font: 700 13px 'Segoe UI', Ubuntu, sans-serif; fill: #22d3ee; letter-spacing: 3px; }
    .text  { font: 600 17px 'Segoe UI', Ubuntu, sans-serif; fill: #e6edf3; }
    .tag   { font: 700 10px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: 1.5px; text-anchor: middle; }
    .row   { opacity: 0; animation: in .7s ease-out forwards; }
    .r1 { animation-delay: .3s; } .r2 { animation-delay: .75s; } .r3 { animation-delay: 1.2s; }
    .r4 { animation-delay: 1.65s; } .r5 { animation-delay: 2.1s; }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 1.6s ease-out forwards; }
    .dot { animation: pulse 2s ease-in-out infinite; }
    @keyframes in { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  </style>

  <rect x="1" y="1" width="798" height="278" rx="18" fill="#0d1117" stroke="#30363d"/>
  <rect class="bar" x="1" y="1" width="798" height="4" rx="2" fill="url(#g)"/>

  <circle class="dot" cx="32" cy="34" r="5" fill="#a78bfa"/>
  <text class="title" x="48" y="39">ABOUT ME</text>

  <g class="row r1">
    <text class="text" x="32" y="88">🌱  Currently learning React &amp; modern web technologies</text>
    <rect x="650" y="71" width="118" height="24" rx="12" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6"/>
    <text class="tag" x="709" y="87" fill="#60a5fa">LEARNING</text>
  </g>
  <g class="row r2">
    <text class="text" x="32" y="126">🚀  Building StudyHub</text>
    <rect x="650" y="109" width="118" height="24" rx="12" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee"/>
    <text class="tag" x="709" y="125" fill="#22d3ee">BUILDING</text>
  </g>
  <g class="row r3">
    <text class="text" x="32" y="164">🤖  Interested in AI automation</text>
    <rect x="650" y="147" width="118" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981"/>
    <text class="tag" x="709" y="163" fill="#34d399">AI</text>
  </g>
  <g class="row r4">
    <text class="text" x="32" y="202">⛓️  Web3 enthusiast, exploring blockchain &amp; smart contracts</text>
    <rect x="650" y="185" width="118" height="24" rx="12" fill="#7c3aed" fill-opacity="0.2" stroke="#a78bfa"/>
    <text class="tag" x="709" y="201" fill="#c4b5fd">WEB3</text>
  </g>
  <g class="row r5">
    <text class="text" x="32" y="240">🍳  Fun fact: Nasgor goreng cihuy!</text>
    <rect x="650" y="223" width="118" height="24" rx="12" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b"/>
    <text class="tag" x="709" y="239" fill="#fbbf24">FUN FACT</text>
  </g>
</svg>
