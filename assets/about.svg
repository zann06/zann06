<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <style>
    .title { font: 600 12px 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; letter-spacing: 4px; }
    .label { font: 600 11px 'Segoe UI', Ubuntu, sans-serif; fill: #6e7681; letter-spacing: 2px; }
    .text  { font: 400 16px 'Segoe UI', Ubuntu, sans-serif; fill: #e6edf3; }
    .row   { opacity: 0; animation: in .6s ease-out forwards; }
    .r1 { animation-delay: .2s; } .r2 { animation-delay: .5s; }
    .r3 { animation-delay: .8s; } .r4 { animation-delay: 1.1s; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <rect x="0.5" y="0.5" width="799" height="249" rx="16" fill="#0d1117" stroke="#21262d"/>

  <text class="title" x="32" y="46">ABOUT ME</text>
  <rect x="32" y="58" width="40" height="2" rx="1" fill="url(#g)"/>

  <g class="row r1">
    <text class="label" x="32" y="104">LEARNING</text>
    <text class="text" x="150" y="104">React &amp; modern web technologies</text>
  </g>
  <line x1="32" y1="122" x2="768" y2="122" stroke="#21262d"/>

  <g class="row r2">
    <text class="label" x="32" y="148">AI</text>
    <text class="text" x="150" y="148">Interested in AI automation</text>
  </g>
  <line x1="32" y1="166" x2="768" y2="166" stroke="#21262d"/>

  <g class="row r3">
    <text class="label" x="32" y="192">WEB3</text>
    <text class="text" x="150" y="192">Exploring blockchain &amp; smart contracts</text>
  </g>
  <line x1="32" y1="210" x2="768" y2="210" stroke="#21262d"/>

  <g class="row r4">
    <text class="label" x="32" y="236">FUN FACT</text>
    <text class="text" x="150" y="236">Nasgor goreng cihuy!</text>
  </g>
</svg>
